     <template id="movia-2">
        <h1 id="login-title">Login</h1>        
        <p class="lead">Đăng nhập bằng email của bạn</p>
        <button type="button" data-open-movia="movia-3" class="btn">Open Movia 3</button>
        <form id="loginForm">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" inputmode="email" autocomplete="email" required
                placeholder="User Name">                
            </div>
            <div class="field password-wrapper">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    minlength="6" placeholder="••••••••" />
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Hiện mật khẩu">Hiện</button>
            </div>
            <button type="submit" class="primary">Đăng nhập</button>
        </form>
    </template>

    <template id="movia-3">
        <h5 class="movia-title">Confirmation</h5>
        <div class="movia-body">
            <p class="text-notification">Do you want to save changes to this document before closing?</p>
            <p class="text-secondary">If you don't save, your changes will be lost.</p>
        </div>
